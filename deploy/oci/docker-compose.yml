# ProsCard backend on the OCI instance (Postgres + API). Run from the repo root on the server:
#   docker compose --env-file api/.env -f deploy/oci/docker-compose.yml up -d --build
# Caddy (deploy/oci/Caddyfile) serves it publicly; nothing here is reachable from the internet directly.
name: proscard

services:
  postgres:
    image: postgres:17-alpine
    container_name: proscard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No published port: only the API reaches the database, over the compose network.
    volumes:
      - proscard_postgres_data:/var/lib/postgresql/data
      - ../../api/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: proscard-api
    restart: unless-stopped
    env_file: ../../api/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      NODE_ENV: production
    command: npm start
    # Loopback only; Caddy proxies the public HTTPS address to it.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8060}:${PORT}"
    volumes:
      # Credentials and the built share page are mounted, never baked into the image.
      - ../../api/secrets:/app/secrets:ro
      - ../../api/web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  proscard_postgres_data:
